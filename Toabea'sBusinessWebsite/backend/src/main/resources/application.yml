spring:
  application:
    name: toabea-closet-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/toabea_closet}
      auto-index-creation: true
  jackson:
    default-property-inclusion: non_null
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-random-256-bit-value}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500}
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  paystack:
    secret-key: ${PAYSTACK_SECRET_KEY:}
    public-key: ${PAYSTACK_PUBLIC_KEY:}
    fee-percent: ${PAYSTACK_FEE_PERCENT:1.95}
    fee-flat: ${PAYSTACK_FEE_FLAT:0}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    folder: ${CLOUDINARY_UPLOAD_FOLDER:toabea-products}
